<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>친구랑 제주 | 여행 추천 코스</title>
<style>
  :root{--sea:#2ba6d6;--sea-d:#0f6f9c;--orange:#ff8a1f;--ink:#23323d;--bg:#f4fbff;--card:#fff}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);line-height:1.65;word-break:keep-all;
    font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
  .hero{position:relative;overflow:hidden;color:#fff;text-align:center;padding:90px 20px 110px;
    background:linear-gradient(180deg,#5cc8ee 0%,#2ba6d6 55%,#1b86b8 100%)}
  .hero::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:70px;
    background:radial-gradient(60px 28px at 30px 70px,var(--bg) 98%,transparent) repeat-x;background-size:120px 70px}
  .sun{position:absolute;top:34px;right:12%;width:84px;height:84px;border-radius:50%;
    background:radial-gradient(circle,#fff6c9,#ffd45a);box-shadow:0 0 60px #fff3a8}
  .mascot{position:relative;display:block;width:clamp(120px,32vw,180px);height:auto;margin:0 auto 14px;
    border-radius:28%;box-shadow:0 10px 24px #0a527755;border:4px solid #fff}
  .hero h1{position:relative;margin:0 0 10px;font-size:clamp(2.2rem,7vw,4rem);text-shadow:0 4px 14px #0a527766}
  .hero p{position:relative;margin:0 auto;max-width:560px;font-size:clamp(1rem,2.4vw,1.2rem)}
  .tags{position:relative;margin-top:22px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .tags span{background:#ffffff33;border:1px solid #ffffff66;padding:5px 14px;border-radius:999px;font-size:.9rem}
  .wrap{width:min(1080px,92vw);margin:0 auto}
  .filters{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:26px 0 8px}
  .filters button{border:2px solid var(--sea);background:#fff;color:var(--sea-d);padding:8px 18px;border-radius:999px;
    font-size:1rem;font-weight:700;cursor:pointer;transition:.2s}
  .filters button.on,.filters button:hover{background:var(--sea);color:#fff}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:22px;padding:18px 0 50px}
  .card{background:var(--card);border-radius:22px;overflow:hidden;box-shadow:0 8px 24px #0f6f9c1f;
    transition:transform .25s,box-shadow .25s}
  .card:hover{transform:translateY(-6px);box-shadow:0 16px 34px #0f6f9c33}
  .card.hide{display:none}
  .pic{height:150px;display:flex;align-items:center;justify-content:center;font-size:4.2rem;position:relative}
  .pic small{position:absolute;left:14px;top:12px;background:#ffffffd9;color:var(--ink);font-size:.78rem;font-weight:700;
    padding:3px 10px;border-radius:999px}
  .body{padding:16px 18px 20px}
  .body h3{margin:0;font-size:1.25rem}
  .area{color:var(--sea-d);font-size:.88rem;font-weight:700;margin-bottom:6px}
  .body p{margin:0 0 10px;font-size:.96rem}
  .tip{background:#fff4e6;border-left:4px solid var(--orange);border-radius:8px;padding:8px 12px;font-size:.88rem}
  .course{background:linear-gradient(135deg,#fff4e6,#e6f6ff);padding:50px 0}
  .course h2,.sec-title{text-align:center;font-size:1.8rem;margin:0 0 6px}
  .sub{text-align:center;color:#58707f;margin:0 0 28px}
  .days{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
  .day{background:#fff;border-radius:20px;padding:22px;box-shadow:0 6px 18px #0f6f9c18}
  .day h3{margin:0 0 10px;color:var(--orange)}
  .day ol{margin:0;padding-left:20px}
  .day li{margin-bottom:6px}
  footer{text-align:center;padding:28px 16px;color:#6a808d;font-size:.9rem}
  @media(max-width:520px){.sun{width:60px;height:60px;right:8%}}
</style>
</head>
<body>
<header class="hero">
  <div class="sun"></div>
  <img class="mascot" src="images/character.svg" alt="돛단배 모자를 쓴 제주 여행 캐릭터" width="180" height="180">
  <h1>친구랑 제주, 어디 갈래?</h1>
  <p>바다·오름·카페·먹거리까지, 둘이서 사진도 추억도 가득 남길 수 있는 제주 여행지를 골라 봤어요.</p>
  <div class="tags"><span>#뚜벅이도OK</span><span>#인생샷</span><span>#힐링</span><span>#맛집탐방</span></div>
</header>


<script>
  const btns=document.querySelectorAll('#filters button'),cards=document.querySelectorAll('.card');
  btns.forEach(b=>b.onclick=()=>{
    btns.forEach(x=>x.classList.remove('on'));b.classList.add('on');
    cards.forEach(c=>c.classList.toggle('hide',b.dataset.f!=='all'&&c.dataset.c!==b.dataset.f));
  });
</script>
</body>
</html>
