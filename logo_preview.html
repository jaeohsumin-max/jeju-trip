<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>제주 오름이 로고 후보</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#FFFFFF;color:#3A2B22;font-family:"Jua","Malgun Gothic",sans-serif;padding:24px 16px 40px}
  h1{margin:0 0 4px;color:#FF8A1F;font-size:1.6rem;text-align:center}
  .sub{margin:0 0 22px;text-align:center;color:#8A7060}
  .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;max-width:900px;margin:0 auto}
  .card{border:2px solid #FFF1E0;border-radius:20px;padding:18px;text-align:center;background:#fff}
  .card h2{margin:0 0 10px;font-size:1.15rem}
  .big{width:160px;height:160px;display:block;margin:0 auto 10px}
  .small{display:flex;align-items:center;justify-content:center;gap:12px;background:#FFF1E0;border-radius:14px;padding:12px;margin-top:8px}
  .small img{width:32px;height:32px;display:block}
  .small span{font-size:.95rem}
  .name{margin-top:10px;color:#FF8A1F;font-size:1.3rem}
  .note{max-width:900px;margin:22px auto 0;text-align:center;color:#8A7060;font-size:.9rem;line-height:1.6}
</style></head><body>
<h1>제주 오름이 · 로고 후보 3개</h1>
<p class="sub">큰 모습과 32px로 줄인 모습을 함께 봅니다</p>
<div class="row">
  <div class="card"><h2>A · 흰 바탕 테두리형</h2>
    <img class="big" src="images/logo_a.svg" alt="로고 A">
    <div class="small"><img src="images/logo_a.svg" alt="로고 A 32px"><span>32px</span></div>
    <div class="name">제주 오름이</div></div>
  <div class="card"><h2>B · 주황 바탕 반전형</h2>
    <img class="big" src="images/logo_b.svg" alt="로고 B">
    <div class="small"><img src="images/logo_b.svg" alt="로고 B 32px"><span>32px</span></div>
    <div class="name">제주 오름이</div></div>
  <div class="card"><h2>C · 오름 위 햇살형</h2>
    <img class="big" src="images/logo_c.svg" alt="로고 C">
    <div class="small"><img src="images/logo_c.svg" alt="로고 C 32px"><span>32px</span></div>
    <div class="name">제주 오름이</div></div>
</div>
<p class="note">색은 정한 색 토큰만 썼습니다: --main #FF8A1F · --point #FFF1E0 · --bg #FFFFFF</p>
</body></html>
