<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>내 여행 취향 | 제주 오름이</title>
<link rel="icon" href="images/icon-180.png" type="image/png" sizes="180x180">
<link rel="apple-touch-icon" href="images/icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  /* brand.md 의 색 토큰과 글꼴 */
  :root{--main:#FF8A1F;--point:#FFF1E0;--bg:#FFFFFF;
    --ink:#3A2B22;        /* 글자색: 읽기 쉽게 진한 색 (brand.md 에는 없음) */
    --ink-soft:#6B5444}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);line-height:1.6;word-break:keep-all;font-size:1.1rem;
    font-family:"Jua","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    min-height:100vh;display:flex;justify-content:center}
  .app{width:100%;max-width:520px;display:flex;flex-direction:column;min-height:100vh}

  header{background:var(--point);border-bottom:6px solid var(--main);padding:14px 16px 16px;position:relative;text-align:center}
  .back{position:absolute;left:8px;top:10px;display:flex;align-items:center;min-height:48px;min-width:48px;padding:0 4px;
    color:var(--ink);text-decoration:none;font-size:2rem;line-height:1;border-radius:14px}
  .back img{width:36px;height:36px;border-radius:10px;margin-left:2px}
  .back:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
  header h1{margin:0;font-size:1.7rem;line-height:1.3}
  header p{margin:4px 0 0;color:var(--ink-soft);font-size:1.05rem}

  /* 탭 3개 */
  .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-bottom:3px solid var(--point);background:var(--bg)}
  .tab{min-height:56px;border:0;background:transparent;color:var(--ink-soft);font-family:inherit;font-size:1.1rem;cursor:pointer;
    border-bottom:6px solid transparent;margin-bottom:-3px;padding:6px 4px}
  .tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--main);background:var(--point)}
  .tab:focus-visible{outline:3px solid var(--ink);outline-offset:-3px}
  .tab .done{display:none;margin-left:4px;font-size:1rem}
  .tab.has .done{display:inline}

  main{flex:1;padding:20px 16px 8px}
  .panel[hidden]{display:none}
  .panel h2{margin:0 0 4px;font-size:1.4rem}
  .panel .hint{margin:0 0 16px;color:var(--ink-soft)}

  .opts{display:grid;gap:12px}
  .opt{position:relative;display:block}
  .opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
  .opt span{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 18px;border-radius:20px;
    border:3px solid var(--point);background:var(--bg);font-size:1.25rem;box-shadow:0 4px 0 var(--point)}
  .opt .emoji{font-size:1.8rem;line-height:1}
  .opt .mark{margin-left:auto;width:30px;height:30px;border-radius:50%;border:3px solid var(--ink);background:var(--bg);
    display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:transparent}
  .opt input[type=checkbox]~span .mark{border-radius:9px}
  .opt input:checked~span{background:var(--main);border-color:var(--ink);box-shadow:0 4px 0 var(--ink)}
  .opt input:checked~span .mark{background:var(--bg);color:var(--ink)}
  .opt input:focus-visible~span{outline:3px solid var(--ink);outline-offset:3px}

  /* 맨 아래 저장 */
  .save-bar{position:sticky;bottom:0;background:var(--bg);border-top:3px solid var(--point);padding:12px 16px calc(14px + env(safe-area-inset-bottom));text-align:center}
  .save{width:100%;min-height:58px;border-radius:999px;border:3px solid var(--ink);background:var(--main);color:var(--ink);
    font-family:inherit;font-size:1.35rem;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
  .save:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
  .save:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
  #msg{min-height:1.8em;margin:10px 0 0;font-size:1.15rem}
  #msg.ok{color:var(--ink)}
  #msg.err{color:#8A1C1C}
  .note{margin:6px 0 0;color:var(--ink-soft);font-size:1rem}
</style>
</head>
<body>
<div class="app">
  <header>
    <a class="back" href="index.html" aria-label="처음 화면으로 돌아가기"><span aria-hidden="true">‹</span><img src="images/logo.svg" alt=""></a>
    <h1>내 여행 취향</h1>
    <p>알려 주시면 취향에 맞게 추천해 드릴게요.</p>
  </header>

  <div class="tabs" role="tablist" aria-label="여행 취향">
    <button class="tab" role="tab" id="tab-style" aria-controls="panel-style" aria-selected="true" data-key="style">스타일<span class="done" aria-hidden="true">✓</span></button>
    <button class="tab" role="tab" id="tab-pace" aria-controls="panel-pace" aria-selected="false" tabindex="-1" data-key="pace">속도<span class="done" aria-hidden="true">✓</span></button>
    <button class="tab" role="tab" id="tab-with" aria-controls="panel-with" aria-selected="false" tabindex="-1" data-key="with">같이 가는 사람<span class="done" aria-hidden="true">✓</span></button>
  </div>

  <main>
    <section class="panel" id="panel-style" role="tabpanel" aria-labelledby="tab-style">
      <h2>어떤 여행을 좋아하세요?</h2>
      <p class="hint">마음에 드는 걸 여러 개 골라도 돼요.</p>
      <div class="opts" id="opts-style">
        <label class="opt"><input type="checkbox" name="style" value="바다"><span><i class="emoji" aria-hidden="true">🌊</i>바다<i class="mark" aria-hidden="true">✓</i></span></label>
        <label class="opt"><input type="checkbox" name="style" value="숲"><span><i class="emoji" aria-hidden="true">🌲</i>숲<i class="mark" aria-hidden="true">✓</i></span></label>
        <label class="opt"><input type="checkbox" name="style" value="오름"><span><i class="emoji" aria-hidden="true">⛰️</i>오름<i class="mark" aria-hidden="true">✓</i></span></label>
        <label class="opt"><input type="checkbox" name="style" value="시장"><span><i class="emoji" aria-hidden="true">🍊</i>시장<i class="mark" aria-hidden="true">✓</i></span></label>
        <label class="opt"><input type="checkbox" name="style" value="박물관"><span><i class="emoji" aria-hidden="true">🏛️</i>박물관<i class="mark" aria-hidden="true">✓</i></span></label>
      </div>
    </section>

    <section class="panel" id="panel-pace" role="tabpanel" aria-labelledby="tab-pace" hidden>
      <h2>어떤 속도가 편하세요?</h2>
      <p class="hint">하나만 골라 주세요.</p>
      <div class="opts" id="opts-pace">
        <label class="opt"><input type="radio" name="pace" value="느긋하게"><span><i class="emoji" aria-hidden="true">🐢</i>느긋하게<i class="mark" aria-hidden="true">✓</i></span></label>
        <label class="opt"><input type="radio" name="pace" value="보통"><span><i class="emoji" aria-hidden="true">🚶</i>보통<i class="mark" aria-hidden="true">✓</i></span></label>
        <label class="opt"><input type="radio" name="pace" value="빡빡하게"><span><i class="emoji" aria-hidden="true">🏃</i>빡빡하게<i class="mark" aria-hidden="true">✓</i></span></label>
      </div>
    </section>

    <section class="panel" id="panel-with" role="tabpanel" aria-labelledby="tab-with" hidden>
      <h2>누구와 함께 가세요?</h2>
      <p class="hint">하나만 골라 주세요.</p>
      <div class="opts" id="opts-with">
        <label class="opt"><input type="radio" name="with" value="혼자"><span><i class="emoji" aria-hidden="true">🙂</i>혼자<i class="mark" aria-hidden="true">✓</i></span></label>
        <label class="opt"><input type="radio" name="with" value="친구"><span><i class="emoji" aria-hidden="true">👫</i>친구<i class="mark" aria-hidden="true">✓</i></span></label>
        <label class="opt"><input type="radio" name="with" value="가족"><span><i class="emoji" aria-hidden="true">👨‍👩‍👧</i>가족<i class="mark" aria-hidden="true">✓</i></span></label>
        <label class="opt"><input type="radio" name="with" value="아이와"><span><i class="emoji" aria-hidden="true">🧒</i>아이와<i class="mark" aria-hidden="true">✓</i></span></label>
      </div>
    </section>
  </main>

  <div class="save-bar">
    <button class="save" id="save" type="button">저장</button>
    <p id="msg" role="status" aria-live="polite"></p>
    <p class="note">이 기기(이 브라우저)에만 저장돼요. 이름이나 전화번호는 받지 않아요.</p>
  </div>
</div>

<script>
  const KEY='jeju-oreum-profile';
  const tabs=[...document.querySelectorAll('.tab')];
  const panels={style:document.getElementById('panel-style'),pace:document.getElementById('panel-pace'),with:document.getElementById('panel-with')};
  const msg=document.getElementById('msg');

  // ---- 탭 전환 ----
  function showTab(key,focus){
    tabs.forEach(t=>{const on=t.dataset.key===key;t.setAttribute('aria-selected',on);t.tabIndex=on?0:-1;if(on&&focus)t.focus()});
    Object.entries(panels).forEach(([k,p])=>p.hidden=(k!==key));
  }
  tabs.forEach((t,i)=>{
    t.addEventListener('click',()=>showTab(t.dataset.key));
    t.addEventListener('keydown',e=>{
      if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
        const n=(i+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length;showTab(tabs[n].dataset.key,true);e.preventDefault();
      }
    });
  });

  // ---- 현재 선택 읽기 / 채우기 ----
  function read(){
    return {
      style:[...document.querySelectorAll('input[name=style]:checked')].map(i=>i.value),
      pace:(document.querySelector('input[name=pace]:checked')||{}).value||'',
      with:(document.querySelector('input[name=with]:checked')||{}).value||''
    };
  }
  function fill(d){
    document.querySelectorAll('input[name=style]').forEach(i=>i.checked=Array.isArray(d.style)&&d.style.includes(i.value));
    document.querySelectorAll('input[name=pace]').forEach(i=>i.checked=(i.value===d.pace));
    document.querySelectorAll('input[name=with]').forEach(i=>i.checked=(i.value===d.with));
  }
  function updateMarks(){
    const d=read();
    document.getElementById('tab-style').classList.toggle('has',d.style.length>0);
    document.getElementById('tab-pace').classList.toggle('has',!!d.pace);
    document.getElementById('tab-with').classList.toggle('has',!!d.with);
  }

  // ---- 저장 / 불러오기 (이 브라우저의 localStorage 에만) ----
  function load(){
    try{
      const raw=localStorage.getItem(KEY);if(!raw)return;
      const d=JSON.parse(raw);
      fill({style:Array.isArray(d.style)?d.style:[],pace:typeof d.pace==='string'?d.pace:'',with:typeof d.with==='string'?d.with:''});
    }catch(e){/* 저장소를 못 읽으면 빈 상태로 시작 */}
  }
  function say(t,cls){msg.textContent=t;msg.className=cls||''}

  document.getElementById('save').addEventListener('click',()=>{
    try{
      localStorage.setItem(KEY,JSON.stringify(read()));
      say('저장했어요','ok');
    }catch(e){
      say('이 브라우저에서는 저장할 수 없어요. 시크릿 창이거나 저장이 막혀 있을 수 있어요.','err');
    }
  });
  // 값을 바꾸면 "저장했어요" 문구는 지워요 (아직 저장 전이니까요)
  document.addEventListener('change',e=>{if(e.target.matches('input')){say('');updateMarks()}});

  load();updateMarks();
</script>
</body>
</html>
